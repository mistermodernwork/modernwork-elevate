<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="960" height="200">
  <title>The four tray icon states: red not signed in, grey nothing active, green at least one role active, amber a role about to expire — each drawn for a light and a dark taskbar</title>
  <!-- Tile geometry and colours copied from src/ModernWorkElevate.App.Avalonia/Assets/tray-icon-*.svg -->
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .h { font-size: 14.5px; font-weight: 600; fill: #0F172A; }
    .t { font-size: 12.5px; fill: #475569; }
  </style>
  <defs>
    <linearGradient id="tile" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1e6fd9"/><stop offset="1" stop-color="#6a4cf0"/></linearGradient>
    <g id="on-light">
      <rect x="1.8" y="1.8" width="28.4" height="28.4" rx="7.5" fill="url(#tile)" stroke="#0b1220" stroke-opacity="0.55" stroke-width="1.6"/>
      <path d="M16 23.5 L16 10" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M9.5 16 L16 9.5 L22.5 16" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle fill="#ffffff" cx="24.6" cy="24.6" r="7"/>
    </g>
    <g id="on-dark">
      <rect x="1.8" y="1.8" width="28.4" height="28.4" rx="7.5" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.6"/>
      <path d="M16 23.5 L16 10" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M9.5 16 L16 9.5 L22.5 16" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle fill="#0b1220" cx="24.6" cy="24.6" r="7"/>
    </g>
    <g id="swatch">
      <rect x="0" y="0" width="94" height="60" rx="8" fill="#EEF1F6"/>
      <rect x="98" y="0" width="94" height="60" rx="8" fill="#202020"/>
    </g>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="199" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>

  <!-- Red -->
  <rect x="24" y="24" width="210" height="152" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <g transform="translate(33 34)">
    <use href="#swatch"/>
    <g transform="translate(26 9) scale(1.3)"><use href="#on-light"/><circle fill="#e5484d" cx="24.6" cy="24.6" r="5.1"/></g>
    <g transform="translate(124 9) scale(1.3)"><use href="#on-dark"/><circle fill="#e5484d" cx="24.6" cy="24.6" r="5.1"/></g>
  </g>
  <text x="40" y="124" class="h">Not signed in</text>
  <text x="40" y="145" class="t">No account yet, or the</text>
  <text x="40" y="162" class="t">session expired.</text>

  <!-- Grey -->
  <rect x="258" y="24" width="210" height="152" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <g transform="translate(267 34)">
    <use href="#swatch"/>
    <g transform="translate(26 9) scale(1.3)"><use href="#on-light"/><circle fill="#8b8d98" cx="24.6" cy="24.6" r="5.1"/></g>
    <g transform="translate(124 9) scale(1.3)"><use href="#on-dark"/><circle fill="#8b8d98" cx="24.6" cy="24.6" r="5.1"/></g>
  </g>
  <text x="274" y="124" class="h">Nothing active</text>
  <text x="274" y="145" class="t">Signed in, no privileges.</text>
  <text x="274" y="162" class="t">The normal resting state.</text>

  <!-- Green -->
  <rect x="492" y="24" width="210" height="152" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <g transform="translate(501 34)">
    <use href="#swatch"/>
    <g transform="translate(26 9) scale(1.3)"><use href="#on-light"/><circle fill="#30a46c" cx="24.6" cy="24.6" r="5.1"/></g>
    <g transform="translate(124 9) scale(1.3)"><use href="#on-dark"/><circle fill="#30a46c" cx="24.6" cy="24.6" r="5.1"/></g>
  </g>
  <text x="508" y="124" class="h">Privileged</text>
  <text x="508" y="145" class="t">At least one role is active.</text>
  <text x="508" y="162" class="t">The tooltip counts them.</text>

  <!-- Amber -->
  <rect x="726" y="24" width="210" height="152" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <g transform="translate(735 34)">
    <use href="#swatch"/>
    <g transform="translate(26 9) scale(1.3)"><use href="#on-light"/><circle fill="#f5a524" cx="24.6" cy="24.6" r="5.1"/></g>
    <g transform="translate(124 9) scale(1.3)"><use href="#on-dark"/><circle fill="#f5a524" cx="24.6" cy="24.6" r="5.1"/></g>
  </g>
  <text x="742" y="124" class="h">Expiring soon</text>
  <text x="742" y="145" class="t">A role is about to run out.</text>
  <text x="742" y="162" class="t">The tooltip names it.</text>
</svg>
