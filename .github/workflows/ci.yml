name: CI

# Runs on every push to the default branch and to feature branches, and on every
# pull request — so a feature branch is built and tested before it is merged.
on:
  push:
    branches: [main, master, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build (warnings as errors)
        run: dotnet build -c Release -warnaserror --no-restore

      - name: Test with coverage
        run: >
          dotnet test -c Release --no-build
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --results-directory ./TestResults

      - name: Enforce coverage gate (ModernWorkElevate.Core >= 70% lines)
        shell: pwsh
        run: ./build/check-coverage.ps1 -MinimumLineRate 0.70

      - name: Build MSI (unsigned)
        shell: pwsh
        run: ./build/build.ps1 -SkipTests

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: ./TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
