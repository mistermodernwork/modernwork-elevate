version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      avalonia:
        patterns: ["Avalonia*"]
      microsoft-identity:
        patterns: ["Microsoft.Identity.*"]
      kiota:
        patterns: ["Microsoft.Kiota.*"]
    ignore:
      # Kiota 2.x needs Microsoft.Graph 6; the app is on Graph SDK v5, and restore fails
      # with NU1608. Revisit together with a Graph SDK upgrade.
      - dependency-name: "Microsoft.Kiota.*"
        update-types: ["version-update:semver-major"]
      # The app targets .NET 10 LTS; Microsoft.Extensions.* majors follow the .NET major and
      # move together with the target framework, not on their own.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
